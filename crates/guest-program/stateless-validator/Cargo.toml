[package]
version = "23.0.0"
name = "ethrex-stateless-validator"
edition = "2024"
license = "MIT OR Apache-2.0"

# Own workspace, like the guest bins. This crate pins zkVM SDK versions to what
# eth-act's `ere` catalog expects, which is deliberately independent of the L2
# prover's pins — bumping SP1 here must not move the L2 verification keys.
[workspace]

[dependencies]
thiserror = "2.0.9"

ethrex-common = { path = "../../common/", default-features = false }
ethrex-crypto = { path = "../../common/crypto", default-features = false }
ethrex-guest-program = { path = "../", default-features = false }

# Must track the root workspace exactly: these are the same containers the host
# encodes, and two libssz versions in one binary would have the guest merkleize
# with a different progressive child order than ethrex-common does.
libssz = "0.3.0"
libssz-merkle = "0.3.0"
libssz-types = "0.3.0"

# ere platform abstraction (entrypoint / IO / cycle scopes) used by the per-zkVM
# bins. Pinned to one ere rev; the ere-compiler and ere-server image tags in
# tag_release.yaml are derived from the same rev.
ere-platform-core = { git = "https://github.com/eth-act/ere", rev = "e115f4ffb46c614db9cb0bb1024f3f45326565ce", optional = true }

# zkvm-standards syscall bindings backing the ZisK and SP1 and OpenVM crypto
# providers. Keeps guest crypto independent of per-SDK patched-crate stacks, so
# the SP1 guest needs no sp1-patches tags at all.
zkvm-interface = { git = "https://github.com/eth-act/zkvm-standards", rev = "282cd356c3a0498416bb0619f9c8a347ce9933fb", optional = true }

[dev-dependencies]
hex = "0.4.3"
serde = { version = "1.0.203", features = ["derive"] }
serde_json = "1.0.117"

[features]
default = []

# Host-side execution (fixture tests, no zkVM): the native crypto backends
# `NativeCrypto` needs.
host = [
    "ethrex-crypto/blst",
    "ethrex-crypto/kzg-rs",
    "ethrex-crypto/secp256k1",
]

# ere-platform entrypoint, used by the per-zkVM guest bins.
ere = ["dep:ere-platform-core"]

# Crypto providers, one per zkVM.
zkvm-interface = ["dep:zkvm-interface"]
sp1 = ["zkvm-interface"]
# `ethrex-common/zisk` swaps the tx/block `OnceCell` for the single-threaded
# `unsync_cell` one on riscv64, matching what `guest-program/bin/zisk` already
# enables. Without it the two ZisK guests compile different cell types.
zisk = ["zkvm-interface", "ethrex-common/zisk"]
openvm = ["zkvm-interface"]
