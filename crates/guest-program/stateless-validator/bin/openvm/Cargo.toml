[workspace]

[package]
version = "23.0.0"
name = "stateless-validator-ethrex-openvm"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
# ere
# `zkvm-accelerator` defines the `zkvm_*` symbols the crypto shim calls, which
# ZisK and SP1 instead get from their runtimes. It also owns the `moduli_init!` /
# `complex_init!` / `sw_init!` block that fixes the VM config, so this binary needs
# neither an `openvm_init.rs` nor an `openvm::init!()`.
ere-platform-openvm = { git = "https://github.com/eth-act/ere", rev = "e115f4ffb46c614db9cb0bb1024f3f45326565ce", features = [
    "std",
    "zkvm-accelerator",
] }

ethrex-stateless-validator = { path = "../..", features = ["ere", "openvm"] }

[profile.release]
codegen-units = 1
lto = "fat"
